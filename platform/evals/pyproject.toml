[project]
name = "workbench-evals"
version = "0.1.0"
description = "Evaluation Engine — datasets, retrieval metrics, LLM judges, eval reports"
requires-python = ">=3.12"
dependencies = [
    "workbench-shared",
    "workbench-runtime",
    "workbench-rag",
    "workbench-observability",
]

[tool.uv.sources]
workbench-observability = { workspace = true }
workbench-shared = { workspace = true }
workbench-runtime = { workspace = true }
workbench-rag = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workbench_evals"]
