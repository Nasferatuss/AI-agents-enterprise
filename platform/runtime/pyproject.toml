[project]
name = "workbench-runtime"
version = "0.1.0"
description = "Agent Runtime — model routing (ADR-008), agent execution, tool calling"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.92",
    "httpx>=0.28",
    "workbench-shared",
    "workbench-observability",
]

[tool.uv.sources]
workbench-observability = { workspace = true }
workbench-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workbench_runtime"]
