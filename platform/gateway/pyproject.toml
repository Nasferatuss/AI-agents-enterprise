[project]
name = "workbench-gateway"
version = "0.1.0"
description = "API Gateway — single entry point for the UI and external clients"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "workbench-shared",
    "workbench-runtime",
    "workbench-rag",
    "workbench-evals",
    "workbench-app-text2sql",
    "workbench-orchestrator",
    "workbench-observability",
    "workbench-app-process",
    "workbench-app-compliance",
    "workbench-app-research",
    "workbench-app-cua",
    "workbench-app-incident",
    "workbench-app-autonomous",
]

[tool.uv.sources]
workbench-observability = { workspace = true }
workbench-app-process = { workspace = true }
workbench-app-compliance = { workspace = true }
workbench-app-research = { workspace = true }
workbench-app-cua = { workspace = true }
workbench-app-incident = { workspace = true }
workbench-app-autonomous = { workspace = true }
workbench-shared = { workspace = true }
workbench-runtime = { workspace = true }
workbench-rag = { workspace = true }
workbench-evals = { workspace = true }
workbench-app-text2sql = { workspace = true }
workbench-orchestrator = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workbench_gateway"]
