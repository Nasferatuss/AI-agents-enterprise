[project]
name = "workbench-gateway"
version = "0.1.0"
description = "API Gateway — single entry point for the UI and external clients"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "workbench-shared",
]

[tool.uv.sources]
workbench-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workbench_gateway"]
