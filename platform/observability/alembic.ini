# Alembic config for the observability trace store.
# Run from the repo root:  uv run alembic -c platform/observability/alembic.ini upgrade head
# The DB URL is NOT set here — env.py reads WB_TRACE_DB_URL (async SQLAlchemy URL).
[alembic]
script_location = platform/observability/alembic
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
