[project]
name = "workbench-observability"
version = "0.1.0"
description = "Observability Layer — custom trace schema (ADR-006): runs, steps, cost, latency, failures"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "asyncpg>=0.30",
    "workbench-shared",
]

[tool.uv.sources]
workbench-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workbench_observability"]
