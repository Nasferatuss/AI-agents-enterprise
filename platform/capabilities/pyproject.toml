[project]
name = "workbench-capabilities"
version = "0.1.0"
description = "Shared platform capabilities — read-only SQL guard, BI database, governed web — reused across apps"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "sqlglot>=25.0",
    "ddgs>=9",
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "workbench-shared",
    "workbench-toolgateway",
]

[tool.uv.sources]
workbench-shared = { workspace = true }
workbench-toolgateway = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workbench_capabilities"]
