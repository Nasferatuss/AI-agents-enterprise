[project]
name = "workbench-jobs"
version = "0.1.0"
description = "Background job queue — pluggable in-process / Redis backends for async runs"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "redis>=5",
    "workbench-shared",
]

[tool.uv.sources]
workbench-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workbench_jobs"]
