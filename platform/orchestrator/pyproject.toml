[project]
name = "workbench-orchestrator"
version = "0.1.0"
description = "Workflow Orchestrator — predictable state machine: steps, retries, branching (ADR-007)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "workbench-shared",
    "workbench-runtime",
]

[tool.uv.sources]
workbench-shared = { workspace = true }
workbench-runtime = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workbench_orchestrator"]
