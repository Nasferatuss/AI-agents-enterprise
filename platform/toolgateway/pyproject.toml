[project]
name = "workbench-toolgateway"
version = "0.1.0"
description = "MCP / Tool Gateway — tool registry, permission allowlist, audit log (ADR-005)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
    "workbench-shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workbench_toolgateway"]
