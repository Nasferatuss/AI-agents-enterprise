[project]
name = "workbench-rag"
version = "0.1.0"
description = "RAG Core — ingestion, chunking, embeddings, hybrid search"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "qdrant-client>=1.12",
    "rank-bm25>=0.2",
    "pypdf>=5.0",
    "workbench-shared",
]

[tool.uv.sources]
workbench-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workbench_rag"]
