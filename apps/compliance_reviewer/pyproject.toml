[project]
name = "workbench-app-compliance"
version = "0.1.0"
description = "Compliance & Risk Reviewer (module #6) — PII detection, policy rules, deterministic risk scoring"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "workbench-shared",
    "workbench-runtime",
]

[tool.uv.sources]
workbench-shared = { workspace = true }
workbench-runtime = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workbench_app_compliance"]
