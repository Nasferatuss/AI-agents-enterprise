[project]
name = "workbench-app-autonomous"
version = "0.1.0"
description = "Autonomous Agent (flagship) — plan → act (tools) → reflect → repeat until the goal is met"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "workbench-shared",
    "workbench-runtime",
    "workbench-toolgateway",
    "workbench-observability",
    "workbench-jobs",
    "workbench-app-research",
    "workbench-app-text2sql",
]

[tool.uv.sources]
workbench-shared = { workspace = true }
workbench-runtime = { workspace = true }
workbench-toolgateway = { workspace = true }
workbench-observability = { workspace = true }
workbench-jobs = { workspace = true }
workbench-app-research = { workspace = true }
workbench-app-text2sql = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workbench_app_autonomous"]
