[project]
name = "workbench-app-research"
version = "0.1.0"
description = "Deep Research Agent (module #7) — plan → research via Tool Gateway → cited report"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "ddgs>=9",
    "beautifulsoup4>=4.12",
    "workbench-shared",
    "workbench-runtime",
    "workbench-toolgateway",
]

[tool.uv.sources]
workbench-shared = { workspace = true }
workbench-runtime = { workspace = true }
workbench-toolgateway = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workbench_app_research"]
