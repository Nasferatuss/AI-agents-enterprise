[project]
name = "workbench-app-text2sql"
version = "0.1.0"
description = "Text-to-SQL BI agent (MVP module #2) — schema-aware SQL agent with read-only guards"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "sqlglot>=25.0",
    "fastapi>=0.115",
    "workbench-shared",
    "workbench-runtime",
]

[tool.uv.sources]
workbench-shared = { workspace = true }
workbench-runtime = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workbench_app_text2sql"]
