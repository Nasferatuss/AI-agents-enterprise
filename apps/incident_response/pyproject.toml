[project]
name = "workbench-app-incident"
version = "0.1.0"
description = "Incident Response Agent (module #10) — failed traces → root-cause classification → RCA report"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "workbench-shared",
    "workbench-runtime",
    "workbench-observability",
]

[tool.uv.sources]
workbench-shared = { workspace = true }
workbench-runtime = { workspace = true }
workbench-observability = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workbench_app_incident"]
