[project]
name = "workbench-app-cua"
version = "0.1.0"
description = "Guarded Computer-Use QA (module #8) — legacy UI sandbox + scenario runner + bug report"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "playwright>=1.40",
    "workbench-shared",
    "workbench-runtime",
    "workbench-toolgateway",
]

[tool.uv.sources]
workbench-shared = { workspace = true }
workbench-runtime = { workspace = true }
workbench-toolgateway = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workbench_app_cua"]

# Ship the legacy CRM page as package data (the Playwright sandbox loads it via file://).
[tool.hatch.build.targets.wheel.force-include]
"src/workbench_app_cua/legacy_ui.html" = "workbench_app_cua/legacy_ui.html"
