[project]
name = "workbench-app-process"
version = "0.1.0"
description = "Business Process Investigator (module #5) — document → entities → process map → backlog"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "workbench-shared",
    "workbench-runtime",
]

[tool.uv.sources]
workbench-shared = { workspace = true }
workbench-runtime = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workbench_app_process"]
