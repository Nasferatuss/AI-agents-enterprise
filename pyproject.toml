[project]
name = "workbench"
version = "0.1.0"
description = "Enterprise AI Agent Workbench — service-oriented platform for production-grade AI agents"
requires-python = ">=3.12"
dependencies = [
    "workbench-shared",
    "workbench-gateway",
    "workbench-runtime",
    "workbench-rag",
    "workbench-evals",
    "workbench-app-text2sql",
    "workbench-orchestrator",
    "workbench-observability",
    "workbench-app-process",
    "workbench-app-compliance",
    "workbench-toolgateway",
    "workbench-app-research",
    "workbench-app-cua",
    "workbench-app-incident",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.9",
]

[tool.uv.workspace]
members = ["platform/shared", "platform/gateway", "platform/runtime", "platform/rag", "platform/evals", "platform/orchestrator", "platform/observability", "apps/text2sql", "apps/process_investigator", "apps/compliance_reviewer", "platform/toolgateway", "apps/deep_research", "apps/computer_use_qa", "apps/incident_response"]

[tool.uv.sources]
workbench-shared = { workspace = true }
workbench-gateway = { workspace = true }
workbench-runtime = { workspace = true }
workbench-rag = { workspace = true }
workbench-evals = { workspace = true }
workbench-app-text2sql = { workspace = true }
workbench-orchestrator = { workspace = true }
workbench-observability = { workspace = true }
workbench-app-process = { workspace = true }
workbench-app-compliance = { workspace = true }
workbench-toolgateway = { workspace = true }
workbench-app-research = { workspace = true }
workbench-app-cua = { workspace = true }
workbench-app-incident = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["platform/shared/src", "platform/gateway/src", "platform/runtime/src", "platform/rag/src", "platform/evals/src", "platform/orchestrator/src", "platform/observability/src", "apps/text2sql/src", "apps/process_investigator/src", "apps/compliance_reviewer/src", "platform/toolgateway/src", "apps/deep_research/src", "apps/computer_use_qa/src", "apps/incident_response/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["platform/gateway/tests", "platform/runtime/tests", "platform/rag/tests", "platform/evals/tests", "platform/orchestrator/tests", "platform/observability/tests", "apps/text2sql/tests", "apps/process_investigator/tests", "apps/compliance_reviewer/tests", "platform/toolgateway/tests", "apps/deep_research/tests", "apps/computer_use_qa/tests", "apps/incident_response/tests", "tests"]
