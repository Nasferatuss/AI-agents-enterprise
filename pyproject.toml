[project]
name = "workbench"
version = "0.1.0"
description = "Enterprise AI Agent Workbench — service-oriented platform for production-grade AI agents"
requires-python = ">=3.12"
dependencies = [
    "workbench-shared",
    "workbench-gateway",
    "workbench-runtime",
    "workbench-jobs",
    "workbench-capabilities",
    "workbench-rag",
    "workbench-evals",
    "workbench-app-text2sql",
    "workbench-orchestrator",
    "workbench-observability",
    "workbench-app-process",
    "workbench-app-compliance",
    "workbench-toolgateway",
    "workbench-app-research",
    "workbench-app-cua",
    "workbench-app-incident",
    "workbench-app-autonomous",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.9",
]

[tool.uv.workspace]
members = ["platform/shared", "platform/gateway", "platform/runtime", "platform/jobs", "platform/capabilities", "platform/rag", "platform/evals", "platform/orchestrator", "platform/observability", "apps/text2sql", "apps/process_investigator", "apps/compliance_reviewer", "platform/toolgateway", "apps/deep_research", "apps/computer_use_qa", "apps/incident_response", "apps/autonomous_agent"]

[tool.uv.sources]
workbench-shared = { workspace = true }
workbench-gateway = { workspace = true }
workbench-runtime = { workspace = true }
workbench-jobs = { workspace = true }
workbench-capabilities = { workspace = true }
workbench-rag = { workspace = true }
workbench-evals = { workspace = true }
workbench-app-text2sql = { workspace = true }
workbench-orchestrator = { workspace = true }
workbench-observability = { workspace = true }
workbench-app-process = { workspace = true }
workbench-app-compliance = { workspace = true }
workbench-toolgateway = { workspace = true }
workbench-app-research = { workspace = true }
workbench-app-cua = { workspace = true }
workbench-app-incident = { workspace = true }
workbench-app-autonomous = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
# Keep in sync with [tool.uv.workspace] members — every member's /src is first-party
# so ruff's import sorter (I) classifies cross-package imports correctly.
src = ["platform/shared/src", "platform/gateway/src", "platform/runtime/src", "platform/jobs/src", "platform/capabilities/src", "platform/rag/src", "platform/evals/src", "platform/orchestrator/src", "platform/observability/src", "platform/toolgateway/src", "apps/text2sql/src", "apps/process_investigator/src", "apps/compliance_reviewer/src", "apps/deep_research/src", "apps/computer_use_qa/src", "apps/incident_response/src", "apps/autonomous_agent/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Real-browser Playwright e2e is opt-in: deselected by default (keeps `make test`
# green without a chromium binary); the dedicated CI job runs `pytest -m playwright`.
markers = ["playwright: real-browser e2e via Playwright/chromium (run with -m playwright)"]
addopts = "-m 'not playwright'"
testpaths = ["platform/shared/tests", "platform/gateway/tests", "platform/runtime/tests", "platform/rag/tests", "platform/evals/tests", "platform/orchestrator/tests", "platform/observability/tests", "platform/jobs/tests", "apps/text2sql/tests", "apps/process_investigator/tests", "apps/compliance_reviewer/tests", "platform/toolgateway/tests", "apps/deep_research/tests", "apps/computer_use_qa/tests", "apps/incident_response/tests", "apps/autonomous_agent/tests", "tests"]

# Coverage over the workspace members' own sources. pytest-cov is pulled in
# ad-hoc by the CI job (`uv run --with pytest-cov`) rather than added to the dev
# group, so measuring coverage does not churn uv.lock.
[tool.coverage.run]
branch = true
source = ["platform", "apps"]
omit = ["*/tests/*", "*/conftest.py", "*/__main__.py"]

[tool.coverage.report]
# A number that counts unreachable lines is not a measurement of anything.
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = true
