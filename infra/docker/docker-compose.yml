name: workbench

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: workbench
      # override in any non-local environment via WB_PG_PASSWORD in .env
      POSTGRES_PASSWORD: ${WB_PG_PASSWORD:-workbench}
      POSTGRES_DB: workbench
    ports:
      # host port is overridable to avoid clashing with another local Postgres
      # (set WB_PG_HOST_PORT in .env). The container always listens on 5432.
      - "${WB_PG_HOST_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workbench -d workbench"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # requirepass is empty by default (local demo). Set WB_REDIS_PASSWORD in any
    # non-local environment — especially with WB_JOB_BACKEND=redis, where the job
    # queue lives in Redis and an unauthenticated, network-reachable Redis would let
    # anyone enqueue work. The DSNs below carry the same password.
    command: ["redis-server", "--requirepass", "${WB_REDIS_PASSWORD:-}"]
    environment:
      WB_REDIS_PASSWORD: ${WB_REDIS_PASSWORD:-}
    ports:
      - "${WB_REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$WB_REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.13.4
    # Empty API key = no auth (local demo). Set WB_QDRANT_API_KEY in any non-local
    # environment; the api service passes the same value as its client api_key.
    environment:
      QDRANT__SERVICE__API_KEY: ${WB_QDRANT_API_KEY:-}
    ports:
      - "${WB_QDRANT_HOST_PORT:-6333}:6333"
      - "${WB_QDRANT_GRPC_HOST_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    env_file:
      - path: ../../.env
        required: false
    environment:
      WB_ENV: dev
      WB_POSTGRES_DSN: postgresql://workbench:${WB_PG_PASSWORD:-workbench}@postgres:5432/workbench
      WB_TRACE_DB_URL: postgresql+asyncpg://workbench:${WB_PG_PASSWORD:-workbench}@postgres:5432/workbench
      WB_REDIS_URL: redis://:${WB_REDIS_PASSWORD:-}@redis:6379/0
      WB_QDRANT_URL: http://qdrant:6333
      WB_QDRANT_API_KEY: ${WB_QDRANT_API_KEY:-}
      # async run model: "inprocess" (default; the api runs jobs itself) or "redis"
      # (enqueue to Redis → the `worker` service below executes them). For the redis
      # path, bring up the worker: docker compose --profile redis-jobs up.
      WB_JOB_BACKEND: ${WB_JOB_BACKEND:-inprocess}
    volumes:
      # autonomous agent's file workspace → a real folder at the repo root, so the
      # artifacts it writes are visible on the host and survive container rebuilds.
      - ../../agent_workspace:/app/data/agent_workspace
    ports:
      - "${WB_API_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

  # Background job worker for the Redis-backed async run model. Off by default;
  # start it (and set WB_JOB_BACKEND=redis) with: docker compose --profile redis-jobs up.
  worker:
    profiles: ["redis-jobs"]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    command: ["uv", "run", "--no-sync", "python", "-m", "workbench_gateway.worker"]
    env_file:
      - path: ../../.env
        required: false
    environment:
      WB_ENV: dev
      WB_JOB_BACKEND: redis
      WB_POSTGRES_DSN: postgresql://workbench:${WB_PG_PASSWORD:-workbench}@postgres:5432/workbench
      WB_TRACE_DB_URL: postgresql+asyncpg://workbench:${WB_PG_PASSWORD:-workbench}@postgres:5432/workbench
      WB_REDIS_URL: redis://:${WB_REDIS_PASSWORD:-}@redis:6379/0
      WB_QDRANT_URL: http://qdrant:6333
      WB_QDRANT_API_KEY: ${WB_QDRANT_API_KEY:-}
    volumes:
      - ../../agent_workspace:/app/data/agent_workspace
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ui:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.ui
      args:
        # baked at build time; for a real deploy set to the public API URL
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "${WB_UI_HOST_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  pg_data:
  qdrant_data:
